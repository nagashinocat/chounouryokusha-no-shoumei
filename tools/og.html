<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<canvas id="c" width="1200" height="630"></canvas>
<script type="module">
import { drawSymbol } from '../src/scene/symbols.js';
const g = document.getElementById('c').getContext('2d'), W = 1200, H = 630;
g.fillStyle = '#050505'; g.fillRect(0, 0, W, H);
const sp = g.createLinearGradient(0, 0, 0, H); sp.addColorStop(0, 'rgba(255,240,210,.16)'); sp.addColorStop(1, 'rgba(255,240,210,0)');
g.fillStyle = sp; g.beginPath(); g.moveTo(W/2-90,0); g.lineTo(W/2+90,0); g.lineTo(W/2+420,H); g.lineTo(W/2-420,H); g.fill();
const rg = g.createRadialGradient(W/2, 330, 20, W/2, 330, 520); rg.addColorStop(0,'rgba(150,10,25,.5)'); rg.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle = rg; g.fillRect(0,0,W,H);
g.textAlign = 'center';
g.fillStyle = '#ff2b3a'; g.font = 'bold 96px "Noto Serif CJK JP","Noto Serif JP",serif'; g.fillText('超能力者の証明', W/2, 215);
g.fillStyle = '#ddd'; g.font = '34px "Noto Sans CJK JP",sans-serif';
g.fillText('なぜか、全人類に超能力者だと信じさせなければならなくなった。', W/2, 300);
['circle','plus','wave','star'].forEach((s, i) => {
  const x = W/2 + (i - 1.5) * 170, y = 450;
  g.fillStyle = '#f3efe4'; g.fillRect(x-60, y-82, 120, 164); g.strokeStyle='#222'; g.lineWidth=3; g.strokeRect(x-52,y-74,104,148);
  drawSymbol(g, s, x, y, 80, '#141414', 7);
});
g.fillStyle = '#888'; g.font = '26px sans-serif'; g.fillText('4枚から、勘だけで当て続けろ。', W/2, 590);
window.done = true;
</script>
