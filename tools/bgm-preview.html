<!doctype html><meta charset="utf-8"><body>
<script type="module">
// BGM の試聴用：楽器が1つずつ増えていく音声を書き出す(1周ごとに1段)
import { createAudio, LOOP_STEPS, STEP_SEC } from '../src/audio.js';
const loop = LOOP_STEPS * STEP_SEC, sr = 44100, secs = loop * 5 + 3;
const ctx = new OfflineAudioContext(2, Math.ceil(sr * secs), sr);
window.setInterval = undefined; // 書き出しでは自分で並べる
const audio = createAudio(null, {}, { context: ctx });
audio.bgm(true);
for (let n = 0; n <= 4; n++) { audio.setLayers(n, loop * n); audio._schedule(loop * (n + 1) - 0.01); }
const buf = await ctx.startRendering();
const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
const out = new DataView(new ArrayBuffer(44 + n * 4));
const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
w(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); w(8, 'WAVEfmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true);
out.setUint16(22, 2, true); out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true);
w(36, 'data'); out.setUint32(40, n * 4, true);
let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
const g = peak > 0.98 ? 0.98 / peak : 1;
for (let i = 0; i < n; i++) { out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i] * g)) * 32767, true); out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i] * g)) * 32767, true); }
const bytes = new Uint8Array(out.buffer); let bin = '';
for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
window.peak = peak; window.wav = btoa(bin);
</script>
